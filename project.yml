name: xFractal
options:
  bundleIdPrefix: com.arizonasoftware
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  # false: with true, XcodeGen puts Signing.xcconfig in an extra group with a random TEMP_ ID,
  # so every run changes the checked-in project.
  createIntermediateGroups: false
  xcodeVersion: "27.1"

# Signing team comes from Signing.xcconfig -> git-ignored Signing.local.xcconfig (public repo).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "204"
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Xcode 27.1 "Update to Recommended Settings".
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

targets:
  xFractalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: xFractal-MAS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arizonasoftware.xFractalTests
        CODE_SIGN_STYLE: Automatic
        # Hosted by the Mac app; its product is xFractal.app, not the target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/xFractal.app/Contents/MacOS/xFractal
        BUNDLE_LOADER: $(TEST_HOST)

  xFractal-iOS:
    type: application
    platform: iOS
    sources:
      - path: xFractal
        excludes:
          - "Info-MAS.plist"
    settings:
      base:
        PRODUCT_NAME: xFractal
        PRODUCT_BUNDLE_IDENTIFIER: ch.arizonasoftware.xfractal  # bundle ID of the 2008 App Store app, so this ships as its update
        INFOPLIST_FILE: xFractal/Info-iOS.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - xFractalGalleryTests

  # Preview gallery (iOS, hosted by the app): scenarios, harness and snapshot test.
  xFractalGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GalleryTests
    dependencies:
      - target: xFractal-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arizonasoftware.xFractalGalleryTests
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/xFractal.app/xFractal
        BUNDLE_LOADER: $(TEST_HOST)

  # The Mac app, shipped only through the Mac App Store / TestFlight: sandboxed,
  # sharing the iOS bundle ID so both platforms are one universal purchase.
  # Keep the target and scheme name: the Xcode Cloud workflows reference it.
  xFractal-MAS:
    type: application
    platform: macOS
    sources:
      - path: xFractal
        excludes:
          - "Info-iOS.plist"
    settings:
      base:
        PRODUCT_NAME: xFractal
        PRODUCT_BUNDLE_IDENTIFIER: ch.arizonasoftware.xfractal
        INFOPLIST_FILE: xFractal/Info-MAS.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: xFractal-MAS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - xFractalTests
