name: xFractal
options:
  bundleIdPrefix: com.arizonasoftware
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.4"

# Signing team comes from Signing.xcconfig -> git-ignored Signing.local.xcconfig (public repo).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  xFractal:
    type: application
    platform: macOS
    sources:
      - path: xFractal
        excludes:
          - "Info-iOS.plist"
          - "Info-MAS.plist"
      # Third-party license notices for frameworks embedded in the macOS app (Sparkle).
      - path: Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: xFractal
        PRODUCT_BUNDLE_IDENTIFIER: com.arizonasoftware.xFractal
        INFOPLIST_FILE: xFractal/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPARKLE
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: xFractal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - framework: Frameworks/Sparkle.framework
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - xFractalTests

  xFractalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: xFractal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arizonasoftware.xFractalTests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Frameworks

  xFractal-iOS:
    type: application
    platform: iOS
    sources:
      - path: xFractal
        excludes:
          - "Info.plist"
          - "Info-MAS.plist"
    settings:
      base:
        PRODUCT_NAME: xFractal
        PRODUCT_BUNDLE_IDENTIFIER: ch.arizonasoftware.xfractal  # bundle ID of the 2008 App Store app, so this ships as its update
        INFOPLIST_FILE: xFractal/Info-iOS.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme: {}

  # Mac App Store build: same app without Sparkle, sandboxed, sharing the iOS
  # bundle ID so both platforms are one universal purchase. The DMG target
  # above keeps Sparkle and its own bundle ID for direct-download users.
  xFractal-MAS:
    type: application
    platform: macOS
    sources:
      - path: xFractal
        excludes:
          - "Info.plist"
          - "Info-iOS.plist"
    settings:
      base:
        PRODUCT_NAME: xFractal
        PRODUCT_BUNDLE_IDENTIFIER: ch.arizonasoftware.xfractal
        INFOPLIST_FILE: xFractal/Info-MAS.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: xFractal-MAS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
